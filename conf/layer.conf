# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-diary"
BBFILE_PATTERN_meta-diary = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-diary = "6"

LAYERDEPENDS_meta-diary = "core"
LAYERSERIES_COMPAT_meta-diary = "scarthgap"
